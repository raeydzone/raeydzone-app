appId: zone.raeyd.app
productName: RaeydZone
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
artifactName: ${productName}-Setup-${version}.${ext}
win:
  target: [nsis]
  icon: build/icon.png
publish:
  provider: github
  owner: raeydzone
  repo: raeydzone-app
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: RaeydZone
