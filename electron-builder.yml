appId: zone.raeyd.app
productName: RaeydZone
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# Windows takes FileDescription from the description, and that is the name Task Manager
# and the details tab show. The long package.json line belongs in the repo, not there.
extraMetadata:
  description: RaeydZone
artifactName: ${productName}-Setup-${version}.${ext}
win:
  target: [nsis]
  icon: build/icon.png
publish:
  provider: github
  owner: raeydzone
  repo: raeydzone-app
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: RaeydZone
